# Render blueprint for ContextBridge.
#
# Deploy: Render dashboard → New → Blueprint → pick ShashwaTTrigunayaT/ContextBridge.
# Render reads this file, builds the Dockerfile and attaches the disk below.
#
# The disk is what makes this a real deployment rather than a demo: the SQLite
# file holds every imported record, claim and handover version. Render's free
# plan has no disks, so `plan` is starter; drop to `free` only if you accept
# that all workspace data resets on every restart or redeploy.

services:
  - type: web
    name: contextbridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # SQLite lives on the mounted disk, not in the image.
      - key: CONTEXTBRIDGE_DB
        value: /var/data/contextbridge.db
      # Public deployments should not print demo passwords on the sign-in page.
      - key: EXPOSE_INSTALL_ACCOUNTS
        value: "false"
      # Lets the Workspaces page switch between the five demo roles. It only
      # issues sessions for install accounts; set to "false" on a real deployment.
      - key: DEMO_ACCOUNT_SWITCHING
        value: "true"
      # Generated once by Render and kept secret; required to sign in.
      - key: INSTALL_PASSWORD
        generateValue: true
      # Optional. Without it the assistant answers deterministically with no model call.
      - key: GROQ_API_KEY
        sync: false
      # Optional. Set to "false" to keep extraction deterministic even with a key.
      - key: LLM_EXTRACTION
        value: "true"
      # Optional GitHub OAuth app. Without these, public repositories and a
      # pasted read-only token still work.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_SCOPE
        value: repo read:user
      # Optional. Only needed when the callback URL differs from this host.
      - key: GITHUB_OAUTH_REDIRECT
        sync: false
    disk:
      name: contextbridge-data
      mountPath: /var/data
      sizeGB: 1
